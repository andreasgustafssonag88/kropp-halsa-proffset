ction>`;locked=false;window.answerQuiz=n=>{if(locked)return;locked=true;let ok=n===q[3],buttons=[...document.querySelectorAll('.answer')];buttons[q[3]].classList.add('correct');if(!ok)buttons[n].classList.add('wrong');if(ok){score++;removeMistake(q)}else addMistake(q);addCat(q[0],ok);results.push({q,ok});save();document.getElementById('feedback').innerHTML=`<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'Rätt!':'Inte riktigt.'}</b> ${esc(q[4])}</div><button class="btn" onclick="nextQuiz()">Nästa</button>`};window.nextQuiz=()=>{i++;draw()}}draw()}
function trainMistakes(){let pool=state.mistakes.map(i=>MC[i]).filter(Boolean);runQuiz('Tidigare fel',pool)}
function startMatching(){enterFocus();let qs=shuffle(MATCH).slice(0,10),left=shuffle(qs.map((q,i)=>({id:i,text:q[0]}))),right=shuffle(qs.map((q,i)=>({id:i,text:q[1]}))),a=null,b=null,done=0,errors=0,locked=false;function draw(message=''){area.innerHTML=`<section class="card"><div class="row"><h2>Para ihop</h2><b>${done}/${qs.length}</b></div>${progress(done,qs.length)}<p class="small">1. Välj ett begrepp. 2. Välj sedan rätt förklaring. Rätt par låses och försvinner visuellt ur uppgiften.</p><div class="match-grid"><div aria-label="Begrepp">${left.map(x=>`<button aria-pressed="${a===x.id}" id="l${x.id}" class="pick ${x.done?'done':''} ${a===x.id?'selected':''}" onclick="pickL(${x.id})" ${x.done?'disabled':''}>${x.done?'✓ ':''}${esc(x.text)}</button>`).join('')}</div><div aria-label="Förklaringar">${right.map(x=>`<button aria-pressed="${b===x.id}" id="r${x.id}" class="pick ${x.done?'done':''} ${b===x.id?'selected':''}" onclick="pickR(${x.id})" ${x.done?'disabled':''}>${x.done?'✓ ':''}${esc(x.text)}</button>`).join('')}</div></div><div id="mf">${message}</div>${a!==null?'<div class="match-note">Valt begrepp: <b>'+esc(left.find(x=>x.id===a).text)+'</b>. Välj nu en förklaring.</div>':''}<div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="startMatching()">Slumpa en ny uppsättning</button><button class="btn secondary" onclick="home()">Avsluta</button></div></section>`}function finish(){let earn=Math.max(10,50-errors*2);state.xp+=earn;state.sessions++;state.history.unshift({type:'Para ihop',label:'10 begrepp',score:Math.max(0,pct(qs.length-errors,qs.length)),date:new Date().toISOString()});state.history=state.history.slice(0,12);save();area.innerHTML=`<section class="card"><h2>Alla par är klara</h2><div class="summary"><div><b>10/10</b><br><span class="small">Parade</span></div><div><b>${errors}</b><br><span class="small">Felkopplingar</span></div><div><b>+${earn}</b><br><span class="small">XP</span></div><div><b>${Math.max(0,pct(qs.length-errors,qs.length))}%</b><br><span class="small">Träffsäkerhet</span></div></div><div class="actions"><button class="btn" onclick="startMatching()">Ny slumpad omgång</button>${homeBtn()}</div></section>`}function testPair(){if(a===null||b===null||locked)return;if(a===b){left.find(x=>x.id===a).done=true;right.find(x=>x.id===b).done=true;done++;a=b=null;if(done===qs.length)finish();else draw('<div class="feedback ok"><b>Rätt par!</b> Fortsätt med nästa.</div>')}else{locked=true;errors++;let le=document.getElementById('l'+a),re=document.getElementById('r'+b);le.classList.add('wrongflash');re.classList.add('wrongflash');document.getElementById('mf').innerHTML='<div class="feedback bad"><b>De hör inte ihop.</b> Valen avmarkeras så att du kan försöka igen.</div>';setTimeout(()=>{a=b=null;locked=false;draw('<div class="feedback bad">Försök igen med ett nytt par.</div>')},550)}}window.pickL=id=>{if(locked||left.find(x=>x.id===id).done)return;a=id;b=null;draw()};window.pickR=id=>{if(locked||right.find(x=>x.id===id).done)return;if(a===null){draw('<div class="feedback warn">Välj först ett begrepp i den övre eller vänstra listan.</div>');return}b=id;draw();setTimeout(testPair,50)};draw()}
function scoreText(text,q){let t=text.toLowerCase(),all=[...q[2],...q[3]],hits=all.filter(k=>t.includes(k.toLowerCase())),req=q[2].filter(k=>t.includes(k.toLowerCase())).length;return{hits,req,all}}
function startWritten(){enterFocus();let qs=shuffle(WRITTEN).slice(0,5),i=0,total=0,ratings=[];function draw(){if(i>=qs.length){state.sessions++;state.xp+=total*2;ratings.forEach(r=>state.confidence[r]=(state.confidence[r]||0)+1);state.history.unshift({type:'Egna svar',label:'5 frågor',score:Math.min(100,total*5),date:new Date().toISOString()});state.history=state.history.slice(0,12);save();let count=x=>ratings.filter(r=>r===x).length;area.innerHTML=`<section class="card"><h2>Omgången är klar</h2><div class="summary"><div><b>${total}</b><br><span class="small">Viktiga delar</span></div><div><b>${count('more')}</b><br><span class="small">Träna mer</span></div><div><b>${count('quite')}</b><br><span class="small">Ganska säker</span></div><div><b>${count('sure')}</b><br><span class="small">Säker</span></div></div><p><b>+${total*2} XP</b></p><div class="actions"><button class="btn" onclick="startWritten()">Ny omgång</button>${homeBtn()}</div></section>`;return}let q=qs[i];area.innerHTML=`<section class="card"><div class="row"><span>${esc(q[0])}</span><b>${i+1}/${qs.length}</b></div>${progress(i,qs.length)}<h2>${esc(q[1])}</h2><textarea id="w" placeholder="Skriv ditt svar med egna ord innan du tittar på exempelsvaret..."></textarea><button class="btn" onclick="checkWritten()">Jämför svaret</button><div id="wf"></div></section>`;window.checkWritten=()=>{let text=document.getElementById('w').value.trim();if(text.length<10){document.getElementById('wf').innerHTML='<div class="feedback warn">Skriv ett lite längre svar först.</div>';return}let sc=scoreText(text,q);total+=sc.hits.length;document.getElementById('w').disabled=true;document.getElementById('wf').innerHTML=`<div class="feedback ${sc.req===q[2].length?'ok':'warn'}"><h3>Jämför ditt svar</h3><div class="chips">${sc.all.map(k=>`<span class="chip ${sc.hits.includes(k)?'hit':'miss'}">${sc.hits.includes(k)?'✓':'○'} ${esc(k)}</span>`).join('')}</div><p><b>Exempelsvar:</b> ${esc(q[4])}</p><p class="small">Ett bra svar behöver inte använda exakt samma ord. Kontrollera att förklaringen och sambanden stämmer.</p></div><h3>Hur säker känner du dig på området?</h3><div class="confidence"><button onclick="rateWritten('more')">🔁 Behöver träna mer</button><button onclick="rateWritten('quite')">👍 Ganska säker</button><button onclick="rateWritten('sure')">⭐ Säker</button></div>`};window.rateWritten=rating=>{ratings.push(rating);i++;draw()}}draw()}
function balancedMC(n){let groups={};MC.forEach(q=>(groups[q[0]]??=[]).push(q));Object.values(groups).forEach(a=>groups[Object.keys(groups).find(k=>groups[k]===a)]=shuffle(a));let cats=shuffle(Object.keys(groups)),out=[];while(out.length<n&&cats.some(c=>groups[c].length)){for(let c of cats)if(groups[c].length&&out.length<n)out.push(groups[c].pop())}return out}
function startExam(){enterFocus();let mqs=balancedMC(12),pairs=shuffle(MATCH).slice(0,5),wqs=shuffle(WRITTEN).slice(0,3),mi=0,mcAnswers=[],pairScore=0,wi=0,wScores=[],started=Date.now();function drawMC(){if(mi>=mqs.length){drawPairs();return}let q=mqs[mi];area.innerHTML=`<section class="card"><div class="row"><b>Provläge · Flerval</b><span>${mi+1}/20</span></div>${progress(mi,20)}<h2>${esc(q[1])}</h2>${q[2].map((a,n)=>`<div class="answer-row"><button class="answer" onclick="examMC(${n})">${esc(a)}</button><button class="read-answer" onclick="speakAnswerAt(${n})" aria-label="Läs upp svarsalternativ ${String.fromCharCode(65+n)}" title="Läs upp detta svar">🔊</button></div>`).join('')}<p class="small">Ingen återkoppling visas under provet.</p></section>`;window.examMC=n=>{mcAnswers.push({q,choice:n,ok:n===q[3]});mi++;drawMC()}}function drawPairs(){let opts=shuffle(pairs.map(q=>q[1]));area.innerHTML=`<section class="card"><div class="row"><b>Provläge · Para ihop</b><span>13–17/20</span></div>${progress(12,20)}${pairs.map((q,i)=>`<label><b>${esc(q[0])}</b><select id="p${i}"><option value="">Välj förklaring...</option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label><br><br>`).join('')}<button class="btn" onclick="savePairs()">Nästa del</button></section>`;window.savePairs=()=>{pairScore=pairs.reduce((s,q,i)=>s+(document.getElementById('p'+i).value===q[1]),0);drawWritten()}}function drawWritten(){if(wi>=wqs.length){finish();return}let q=wqs[wi];area.innerHTML=`<section class="card"><div class="row"><b>Provläge · Eget svar</b><span>${18+wi}/20</span></div>${progress(17+wi,20)}<h2>${esc(q[1])}</h2><textarea id="ew" placeholder="Skriv ett utvecklat svar..."></textarea><button class="btn" onclick="saveWritten()">Spara och gå vidare</button><p class="small">Egna svar bedöms ungefärligt genom viktiga begrepp.</p></section>`;window.saveWritten=()=>{let s=scoreText(document.getElementById('ew').value,q),ok=s.req>=Math.ceil(q[2].length*.6);wScores.push({q,ok,hits:s.hits});wi++;drawWritten()}}function finish(){let mcScore=mcAnswers.filter(x=>x.ok).length,wScore=wScores.filter(x=>x.ok).length,total=mcScore+pairScore+wScore,percent=pct(total,20),per={};mcAnswers.forEach(x=>{per[x.q[0]]??={right:0,total:0};per[x.q[0]].total++;if(x.ok)per[x.q[0]].right++;addCat(x.q[0],x.ok);if(x.ok)removeMistake(x.q);else addMistake(x.q)});state.latest=percent;state.best=Math.max(state.best,percent);state.examCount++;state.xp+=total*8;state.history.unshift({type:'Prov',label:`${total}/20`,score:percent,date:new Date().toISOString()});state.history=state.history.slice(0,12);save();let weak=Object.entries(per).filter(([k,v])=>pct(v.right,v.total)<70),strong=Object.entries(per).filter(([k,v])=>pct(v.right,v.total)>=80),wrong=mcAnswers.filter(x=>!x.ok);area.innerHTML=`<section class="card"><h2>Provet är klart</h2><div class="summary"><div><b>${mcScore}/12</b><br><span class="small">Flerval</span></div><div><b>${pairScore}/5</b><br><span class="small">Para ihop</span></div><div><b>${wScore}/3</b><br><span class="small">Egna svar</span></div><div><b>${percent}%</b><br><span class="small">Totalt</span></div></div><h3>Resultat per område</h3>${Object.entries(per).map(([k,v])=>`<div class="area-row ${pct(v.right,v.total)<70?'weak':pct(v.right,v.total)>=80?'strong':''}"><b>${esc(k)}</b><div class="bar"><div style="width:${pct(v.right,v.total)}%"></div></div><span>${pct(v.right,v.total)}%</span></div>`).join('')}<h3>Starka områden</h3><p>${strong.length?strong.map(x=>esc(x[0])).join(', '):'Fortsätt träna så växer listan.'}</p><h3>Områden att repetera</h3><p>${weak.length?weak.map(x=>esc(x[0])).join(', '):'Inga tydliga svaga områden i detta prov.'}</p>${wrong.length?`<h3>Felaktiga flervalsfrågor</h3>${wrong.map(x=>`<div class="review"><h4>${esc(x.q[1])}</h4><p>Ditt svar: ${esc(x.q[2][x.choice])}</p><p><b>Rätt svar:</b> ${esc(x.q[2][x.q[3]])}</p></div>`).join('')}`:''}<p class="small">Egna svar är ungefärligt kontrollerade. Jämför alltid med faktahäftet och exempelsvaren.</p><div class="actions">${wrong.length?'<button class="btn" onclick="trainMistakes()">Träna på felen</button>':''}<button class="btn secondary" onclick="startExam()">Gör ett nytt prov</button>${homeBtn()}</div></section>`}drawMC()}
function showStats(){enterFocus();let cats=Object.entries(state.category).sort((a,b)=>a[0].localeCompare(b[0]));area.innerHTML=`<section class="card"><h2>Min statistik</h2><div class="summary"><div><b>${state.latest===null?'–':state.latest+'%'}</b><br><span class="small">Senaste prov</span></div><div><b>${state.best}%</b><br><span class="small">Bästa prov</span></div><div><b>${state.sessions}</b><br><span class="small">Träningsomgångar</span></div><div><b>${state.examCount}</b><br><span class="small">Prov</span></div></div><h3>Resultat per område</h3>${cats.length?cats.map(([k,v])=>`<div class="area-row ${pct(v.right,v.total)<60?'weak':''}"><b>${esc(k)}</b><div class="bar"><div style="width:${pct(v.right,v.total)}%"></div></div><span>${v.right}/${v.total} · ${pct(v.right,v.total)}%</span></div>`).join(''):'<p>Ingen statistik ännu. Gör en träningsomgång först.</p>'}<h3>Självskattning efter egna svar</h3><div class="summary"><div><b>${state.confidence.more||0}</b><br><span class="small">Träna mer</span></div><div><b>${state.confidence.quite||0}</b><br><span class="small">Ganska säker</span></div><div><b>${state.confidence.sure||0}</b><br><span class="small">Säker</span></div><div><b>${(state.confidence.more||0)+(state.confidence.quite||0)+(state.confidence.sure||0)}</b><br><span class="small">Skattningar</span></div></div><h3>Senaste aktiviteter</h3>${state.history.length?state.history.map(h=>`<div class="review"><b>${esc(h.type)}</b> · ${esc(h.label)} <span class="small">${new Date(h.date).toLocaleDateString('sv-SE')}</span><span style="float:right"><b>${h.score}%</b></span></div>`).join(''):'<p>Inga aktiviteter sparade.</p>'}<div class="actions">${homeBtn()}</div></section>`}
function showReset(){enterFocus();area.innerHTML=`<section class="card"><h2>Återställ sparade resultat</h2><p>Detta tar bort XP, nivå, bästa resultat, historik och sparade fel på den här enheten.</p><div class="feedback warn"><b>Observera:</b> Åtgärden kan inte ångras.</div><div class="actions"><button class="btn danger" onclick="resetAll()">Återställ allt</button>${homeBtn()}</div></section>`}function resetAll(){localStorage.removeItem(KEY);state=emptyState();save();area.innerHTML=`<section class="card"><div class="feedback ok">All lokal statistik är återställd.</div>${homeBtn()}</section>`}
</script></body></html>
