ersonlighet, intressen, relationer och värderingar."], ["Relationer", "Vad kännetecknar en bra och respektfull relation? Ge två exempel.", ["respekt"], ["kommunikation", "lyssna", "trygg", "ärlig"], "En bra relation bygger exempelvis på respekt, kommunikation och att människor lyssnar på varandra."], ["Samtycke", "Vad betyder samtycke på generell nivå och varför får man alltid ändra sig?", ["frivillig", "tydlig"], ["press", "tjat", "ändra", "respekt"], "Samtycke betyder att alla deltar frivilligt och tydligt visar att de vill. Samtycke ska inte bygga på press, och alla får alltid ändra sig."], ["Nikotin", "Vad är nikotin och varför kan det skapa beroende?", ["nikotin", "hjärn", "beroende"], ["belöningssystem", "sug", "vänjer"], "Nikotin är ett beroendeframkallande ämne som påverkar hjärnan. Hjärnan och kroppen kan vänja sig, vilket kan leda till sug och svårigheter att sluta."], ["Alkohol", "Ge tre exempel på hur alkohol kan påverka kroppen och hjärnan.", ["omdöme", "reaktion", "balans"], ["hjärna", "nervsystem", "beslut", "lever"], "Alkohol kan försämra omdömet, reaktionsförmågan och balansen. Därför kan det bli svårare att fatta bra beslut. Levern bryter ner alkoholen."], ["Beroende", "Vad är hjärnans belöningssystem och hur kan beroendeframkallande ämnen påverka det?", ["belöningssystem", "hjärn"], ["positiv", "ämne", "sug", "beroende"], "Belöningssystemet aktiveras när vi gör sådant kroppen uppfattar som positivt. Beroendeframkallande ämnen kan påverka systemet kraftigt så att hjärnan vill ha ämnet igen."], ["Beroende", "En person använder nikotin regelbundet och får starkt sug. Förklara med begreppen nikotin, hjärnan, belöningssystem och beroende.", ["nikotin", "hjärn", "belöningssystem", "beroende"], ["sug", "vänjer", "sluta"], "Nikotin har påverkat hjärnans belöningssystem. Hjärnan kan ha vant sig vid ämnet och börjat vilja ha det igen. Det kan ge starkt sug och göra det svårt att sluta, vilket är tecken på beroende."]];
let xp=Number(localStorage.getItem('khp_xp')||0),best=Number(localStorage.getItem('khp_best')||0);const area=document.getElementById('area');function sync(){document.getElementById('xp').textContent=xp;document.getElementById('level').textContent=Math.floor(xp/150)+1;document.getElementById('best').textContent=best+'%';localStorage.setItem('khp_xp',xp)}sync();const shuffle=a=>[...a].sort(()=>Math.random()-.5);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function homeBtn(){return `<button class="btn secondary" onclick="area.innerHTML=''">Till startsidan</button>`}function addXP(n){xp+=n;sync()}
function startQuiz(){const cats=['Alla',...new Set(MC.map(q=>q[0]))];area.innerHTML='<section class="card"><h2>Välj område</h2><div class="category-list">'+cats.map((c,i)=>`<button class="${i===0?'active':''}" onclick="runQuiz('${c.replace(/'/g,"\'")}')">${esc(c)}</button>`).join('')+'</div><p class="small">Välj Alla för hela frågebanken eller ett särskilt område.</p>'+homeBtn()+'</section>'}function runQuiz(cat){let qs=shuffle(cat==='Alla'?MC:MC.filter(q=>q[0]===cat)),i=0,score=0,locked=false;function draw(){if(i>=qs.length){addXP(score*5);area.innerHTML=`<section class="card"><h2>Träningen är klar</h2><div class="summary"><div><b>${score}/${qs.length}</b><br><span class="small">Rätt</span></div><div><b>${Math.round(score/qs.length*100)}%</b><br><span class="small">Resultat</span></div><div><b>+${score*5} XP</b><br><span class="small">Belöning</span></div></div><p>${score/qs.length>=.8?'Mycket bra! Fortsätt med provläget.':'Träna gärna en gång till på de områden som kändes svåra.'}</p>${homeBtn()}</section>`;return}let q=qs[i];area.innerHTML=`<section class="card"><div class="row"><span>${esc(q[0])}</span><b>${i+1}/${qs.length}</b></div><div class="progress"><div style="width:${i/qs.length*100}%"></div></div><h2>${esc(q[1])}</h2><div id="answers">${q[2].map((a,n)=>`<button class="answer" onclick="chooseMC(${n})">${esc(a)}</button>`).join('')}</div><div id="fb"></div></section>`;locked=false;window.chooseMC=n=>{if(locked)return;locked=true;let buttons=[...document.querySelectorAll('.answer')];buttons[q[3]].classList.add('correct');if(n===q[3]){score++;buttons[n].classList.add('correct');document.getElementById('fb').innerHTML=`<div class="feedback ok"><b>Rätt!</b> ${esc(q[4])}</div><button class="btn" onclick="nextMC()">Nästa</button>`}else{buttons[n].classList.add('wrong');document.getElementById('fb').innerHTML=`<div class="feedback bad"><b>Inte riktigt.</b> ${esc(q[4])}</div><button class="btn" onclick="nextMC()">Nästa</button>`}};window.nextMC=()=>{i++;draw()}}draw()}
function startMatching(custom){let qs=shuffle(custom||MATCH).slice(0,custom?custom.length:10),left=shuffle(qs.map((q,i)=>({text:q[0],id:i}))),right=shuffle(qs.map((q,i)=>({text:q[1],id:i}))),selL=null,selR=null,done=0,mistakes=0;function draw(){area.innerHTML=`<section class="card"><div class="row"><h2>Para ihop</h2><b>${done}/${qs.length}</b></div><p class="small">Klicka först på ett begrepp och sedan på rätt förklaring.</p><div class="match-grid"><div id="left">${left.map(x=>`<button id="l${x.id}" class="match-item" onclick="pickL(${x.id})">${esc(x.text)}</button>`).join('')}</div><div id="right">${right.map(x=>`<button id="r${x.id}" class="match-item" onclick="pickR(${x.id})">${esc(x.text)}</button>`).join('')}</div></div><div id="mfb"></div></section>`;restore()}function restore(){left.forEach(x=>{let e=document.getElementById('l'+x.id);if(x.done)e.classList.add('done')});right.forEach(x=>{let e=document.getElementById('r'+x.id);if(x.done)e.classList.add('done')})}function check(){if(selL===null||selR===null)return;if(selL===selR){left.find(x=>x.id===selL).done=true;right.find(x=>x.id===selR).done=true;done++;selL=selR=null;if(done===qs.length){let earn=Math.max(10,qs.length*5-mistakes*2);addXP(earn);area.innerHTML=`<section class="card"><h2>Alla par är klara!</h2><p>Du gjorde ${mistakes} felkopplingar.</p><p><b>+${earn} XP</b></p>${homeBtn()}</section>`}else draw()}else{mistakes++;document.getElementById('mfb').innerHTML='<div class="feedback bad">De hör inte ihop. Försök igen.</div>';document.getElementById('l'+selL).classList.remove('selected');document.getElementById('r'+selR).classList.remove('selected');selL=selR=null}}window.pickL=id=>{if(left.find(x=>x.id===id).done)return;if(selL!==null)document.getElementById('l'+selL).classList.remove('selected');selL=id;document.getElementById('l'+id).classList.add('selected');check()};window.pickR=id=>{if(right.find(x=>x.id===id).done)return;if(selR!==null)document.getElementById('r'+selR).classList.remove('selected');selR=id;document.getElementById('r'+id).classList.add('selected');check()};draw()}
function scoreText(text,q){let t=text.toLowerCase(),required=q[2],bonus=q[3],hits=[...required,...bonus].filter(k=>t.includes(k.toLowerCase()));return{hits,total:required.length+bonus.length,requiredOK:required.filter(k=>t.includes(k.toLowerCase())).length}}function startWritten(custom){let qs=shuffle(custom||WRITTEN),i=0,total=0;function draw(){if(i>=qs.length){addXP(total*3);area.innerHTML=`<section class="card"><h2>Egna svar är klara</h2><p>Du hittade totalt <b>${total}</b> viktiga begrepp.</p><p><b>+${total*3} XP</b></p>${homeBtn()}</section>`;return}let q=qs[i];area.innerHTML=`<section class="card"><div class="row"><span>${esc(q[0])}</span><b>${i+1}/${qs.length}</b></div><h2>${esc(q[1])}</h2><textarea id="written" placeholder="Skriv ditt svar med egna ord..."></textarea><button class="btn" onclick="checkW()">Jämför svaret</button><div id="wfb"></div></section>`;window.checkW=()=>{let val=document.getElementById('written').value.trim();if(val.length<10){document.getElementById('wfb').innerHTML='<div class="feedback bad">Skriv ett lite längre svar innan du jämför.</div>';return}let s=scoreText(val,q);total+=s.hits.length;let all=[...q[2],...q[3]];document.getElementById('wfb').innerHTML=`<div class="feedback ${s.requiredOK===q[2].length?'ok':'bad'}"><b>Viktiga ord och delar:</b><div class="chips">${all.map(k=>`<span class="chip ${s.hits.includes(k)?'hit':'miss'}">${s.hits.includes(k)?'✓':'○'} ${esc(k)}</span>`).join('')}</div><p><b>Exempelsvar:</b> ${esc(q[4])}</p><p class="small">Ditt svar bedöms inte automatiskt som helt rätt eller fel. Jämför innehållet med exempelsvaret.</p></div><button class="btn" onclick="nextW()">Nästa fråga</button>`};window.nextW=()=>{i++;draw()}}draw()}
function startExam(){let mqs=shuffle(MC).slice(0,12),pairs=shuffle(MATCH).slice(0,5),wqs=shuffle(WRITTEN).slice(0,3),i=0,mcScore=0;function mcDraw(){if(i>=mqs.length){examMatch();return}let q=mqs[i];area.innerHTML=`<section class="card"><div class="row"><b>Provläge: flerval</b><span>${i+1}/12</span></div><div class="progress"><div style="width:${i/20*100}%"></div></div><h2>${esc(q[1])}</h2>${q[2].map((a,n)=>`<button class="answer" onclick="examMC(${n})">${esc(a)}</button>`).join('')}</section>`;window.examMC=n=>{if(n===q[3])mcScore++;i++;mcDraw()}}function examMatch(){let answers=shuffle(pairs.map(q=>q[1]));area.innerHTML=`<section class="card"><b>Provläge: para ihop</b><div class="progress"><div style="width:60%"></div></div><p>Välj rätt förklaring till varje begrepp.</p>${pairs.map((q,n)=>`<label><b>${esc(q[0])}</b><select id="ep${n}"><option value="">Välj...</option>${answers.map(a=>`<option>${esc(a)}</option>`).join('')}</select></label><br><br>`).join('')}<button class="btn" onclick="checkExamPairs()">Nästa del</button></section>`;window.checkExamPairs=()=>{let score=pairs.reduce((s,q,n)=>s+(document.getElementById('ep'+n).value===q[1]),0);examWritten(score)}}function examWritten(pairScore){let wi=0,wordScore=0;function wdraw(){if(wi>=wqs.length){finish(pairScore,wordScore);return}let q=wqs[wi];area.innerHTML=`<section class="card"><b>Provläge: egna svar ${wi+1}/3</b><div class="progress"><div style="width:${(17+wi)/20*100}%"></div></div><h2>${esc(q[1])}</h2><textarea id="examw" placeholder="Skriv ett utvecklat svar..."></textarea><button class="btn" onclick="examWNext()">Spara och gå vidare</button></section>`;window.examWNext=()=>{let s=scoreText(document.getElementById('examw').value,q);if(s.requiredOK>=Math.ceil(q[2].length*.6))wordScore++;wi++;wdraw()}}wdraw()}function finish(pairScore,wordScore){let total=mcScore+pairScore+wordScore,max=20,pct=Math.round(total/max*100);if(pct>best){best=pct;localStorage.setItem('khp_best',best)}addXP(total*8);sync();area.innerHTML=`<section class="card"><h2>Provet är klart</h2><div class="summary"><div><b>${mcScore}/12</b><br><span class="small">Flerval</span></div><div><b>${pairScore}/5</b><br><span class="small">Para ihop</span></div><div><b>${wordScore}/3</b><br><span class="small">Egna svar</span></div></div><h3>Totalt: ${total}/20, ${pct}%</h3><p>${pct>=85?'Mycket starkt resultat.':pct>=70?'Bra resultat. Repetera några svagare områden.':pct>=50?'Du är på väg. Fortsätt träna inför provet.':'Träna vidare område för område och försök igen.'}</p><p class="small">Egna svar kan bara bedömas ungefärligt av programmet. Jämför alltid med faktahäftet och exempelsvaren.</p><p><b>+${total*8} XP</b></p>${homeBtn()}</section>`}mcDraw()}
</script></body></html>
